name: Release to Modrinth

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g., v2.9.0+1.21.9)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository at tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}

      # Each MC line needs its own JDK; the tag's build.gradle names it.
      - name: Detect Java version
        id: java
        run: |
          version=$(grep -oP 'options\.release = \K[0-9]+' build.gradle)
          test -n "$version" || { echo "::error::No options.release in build.gradle"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ steps.java.outputs.version }}
          distribution: 'microsoft'

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and publish to Modrinth
        run: ./gradlew build publishModrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: Check if CHANGELOG exists
        id: changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          body_path: ${{ steps.changelog.outputs.exists == 'true' && 'CHANGELOG.md' || '' }}
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}